services:
  postgres:
    image: postgres:16-alpine
    container_name: rms-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    env_file:
      - ./inventory-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inventory_db?schema=public
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: on-failure

  order-service:
    build:
      context: ./order-service
    container_name: order-service
    ports:
      - "5000:5000"
    env_file:
      - ./order-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/order_db?schema=public
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: on-failure

  payment-service:
    build:
      context: ./payment-service
    container_name: payment-service
    env_file:
      - ./payment-service/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_db?schema=public
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: on-failure

volumes:
  postgres-data:
